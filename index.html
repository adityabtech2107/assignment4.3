<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 30px;
        }
        .form-container {
            max-width: 500px;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #0066cc;
            outline: none;
        }
        .radio-group, .checkbox-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .radio-group label, .checkbox-group label {
            font-weight: normal;
            display: inline;
            cursor: pointer;
        }
        input[type="disabled"], input:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
        }
        button {
            width: 100%;
            background-color: #0066cc;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #004fb3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Job Application Form</h2>
        
        <form action="#" method="POST">
            
            <!-- Disabled Field Example (e.g., Application Status) -->
            <div class="form-group">
                <label for="app-status">Application Status:</label>
                <input type="text" id="app-status" name="appStatus" value="Open for Submissions" disabled>
            </div>

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required placeholder="123-456-7890">
            </div>

            <!-- Date of Birth -->
            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <!-- Portfolio URL -->
            <div class="form-group">
                <label for="portfolio">Portfolio URL:</label>
                <input type="url" id="portfolio" name="portfolio" placeholder="https://yourportfolio.com">
            </div>

            <!-- Dropdown for Job Role -->
            <div class="form-group">
                <label for="job-role">Preferred Job Role:</label>
                <select id="job-role" name="jobRole" required>
                    <option value="">-- Select a Role --</option>
                    <option value="frontend">Frontend Developer</option>
                    <option value="backend">Backend Developer</option>
                    <option value="fullstack">Full-Stack Developer</option>
                    <option value="uiux">UI/UX Designer</option>
                </select>
            </div>

            <!-- Radio Buttons for Preferred Shift -->
            <div class="form-group">
                <label>Preferred Shift:</label>
                <div class="radio-group">
                    <label><input type="radio" name="shift" value="morning" required> Morning</label>
                    <label><input type="radio" name="shift" value="evening"> Evening</label>
                    <label><input type="radio" name="shift" value="remote"> Remote / Flexible</label>
                </div>
            </div>

            <!-- Checkboxes for Skills -->
            <div class="form-group">
                <label>Skills:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="skills" value="html"> HTML5</label>
                    <label><input type="checkbox" name="skills" value="css"> CSS3</label>
                    <label><input type="checkbox" name="skills" value="js"> JavaScript</label>
                </div>
            </div>

            <!-- Textarea for Cover Letter -->
            <div class="form-group">
                <label for="cover-letter">Cover Letter:</label>
                <textarea id="cover-letter" name="coverLetter" rows="4" placeholder="Briefly describe why you are a great fit for this position..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit">Submit Application</button>

        </form>
    </div>

</body>
</html>
